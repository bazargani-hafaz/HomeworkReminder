name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Kotlin source structure
        run: |
          grep -n "fun JalaliCalendar" app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          grep -n "fun ColumnScope.StatsScreen" app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          tail -n 5 app/src/main/java/com/example/homeworkreminder/MainActivity.kt
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeworkReminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
