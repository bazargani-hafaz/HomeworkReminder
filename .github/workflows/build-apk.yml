name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix Compose ColumnScope weight usage
        run: |
          sed -i 's/^fun HomeScreen(/fun ColumnScope.HomeScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun CalendarScreen(/@Composable fun ColumnScope.CalendarScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun CompletedScreen(/@Composable fun ColumnScope.CompletedScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun SettingsScreen(/@Composable fun ColumnScope.SettingsScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
      - name: Fix Jalali calendar syntax
        run: |
          python3 - <<'PY'
          p = "app/src/main/java/com/example/homeworkreminder/MainActivity.kt"
          text = open(p, encoding="utf-8").read()
          start = text.index("@Composable fun JalaliCalendar")
          end = text.index("@Composable fun ColumnScope.StatsScreen", start)
          replacement = '''@Composable
fun JalaliCalendar(tasks: List<Homework>, base: Calendar, prev: () -> Unit, next: () -> Unit) {
    val names = listOf("فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند")
    val j = gregorianToJalali(base.get(Calendar.YEAR), base.get(Calendar.MONTH) + 1, 1)
    val jy = j.first
    val jm = j.second
    val days = jalaliMonthDays(jy, jm)
    val g = jalaliToGregorian(jy, jm, 1)
    val first = Calendar.getInstance().apply { set(g[0], g[1] - 1, g[2]) }
    val offset = (first.get(Calendar.DAY_OF_WEEK) + 1) % 7
    Column(
        Modifier.fillMaxWidth()
            .clip(RoundedCornerShape(22.dp))
            .background(MaterialTheme.colorScheme.surface)
            .padding(13.dp)
    ) {
        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
            IconButton(onClick = prev) { Icon(Icons.Default.ChevronRight, null) }
            Text("${names[jm - 1]} $jy", color = MaterialTheme.colorScheme.onSurface, fontSize = 17.sp, fontWeight = FontWeight.Bold)
            IconButton(onClick = next) { Icon(Icons.Default.ChevronLeft, null) }
        }
        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
            listOf("ش", "ی", "د", "س", "چ", "پ", "ج").forEach {
                Text(it, color = Muted, fontSize = 10.sp, modifier = Modifier.width(35.dp), textAlign = TextAlign.Center)
            }
        }
        val cells = List(offset) { 0 } + (1..days).toList()
        val padded = cells + List((7 - cells.size % 7) % 7) { 0 }
        padded.chunked(7).forEach { week ->
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                week.forEach { d ->
                    val has = if (d == 0) false else tasks.any { t ->
                        val x = taskJalali(t.due)
                        x[0] == jy && x[1] == jm && x[2] == d
                    }
                    Box(Modifier.size(35.dp), contentAlignment = Alignment.Center) {
                        if (d > 0) {
                            Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                Text(d.toString(), color = MaterialTheme.colorScheme.onSurface, fontSize = 11.sp)
                                if (has) Text("•", color = MaterialTheme.colorScheme.primary, fontSize = 12.sp)
                            }
                        }
                    }
                }
            }
        }
    }
}

'''
          open(p, "w", encoding="utf-8").write(text[:start] + replacement + text[end:])
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeworkReminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
