name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix Compose ColumnScope weight usage
        run: |
          sed -i 's/^fun HomeScreen(/fun ColumnScope.HomeScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun CalendarScreen(/@Composable fun ColumnScope.CalendarScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun CompletedScreen(/@Composable fun ColumnScope.CompletedScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
          sed -i 's/^@Composable fun SettingsScreen(/@Composable fun ColumnScope.SettingsScreen(/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
      - name: Fix Jalali calendar syntax
        run: |
          sed -i '156s/} }$/ }/' app/src/main/java/com/example/homeworkreminder/MainActivity.kt
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeworkReminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
